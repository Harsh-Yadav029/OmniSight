version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: omnisight-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: omnisight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnisight-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/omnisight
    depends_on:
      - mongo

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: omnisight-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:5000
      - TEST_TARGET_APP_URL=http://test-target-app:5173
    depends_on:
      - redis
      - backend

  test-target-app:
    build:
      context: ./test-target-app
      dockerfile: Dockerfile
    container_name: omnisight-test-target-app
    restart: unless-stopped
    ports:
      - "5173:5173"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnisight-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  mongo_data:
